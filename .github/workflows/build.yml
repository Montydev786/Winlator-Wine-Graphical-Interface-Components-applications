name: Build setup.exe

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to attach files to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ x86_64, i686 ]     # 64-bit and 32-bit Winlator containers
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (mingw-w64 + NSIS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 nsis

      - name: Compile MontyShell.exe
        run: make ARCH=${{ matrix.arch }}

      - name: Build installer (setup.exe)
        run: make installer ARCH=${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MontyShell-${{ matrix.arch }}
          path: |
            build/MontyShell.exe
            build/MontyShell-Setup-${{ matrix.arch }}.exe

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MontyShell-Setup-${{ matrix.arch }}.exe
